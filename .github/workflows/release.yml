name: Release

# Every push to main: if changesets are pending, open/update the
# "chore: version packages" PR; once that PR is merged (no changesets left),
# publish the bumped packages to npm.
#
# Auth is npm trusted publishing (OIDC) — no NPM_TOKEN secret exists or is
# needed. One-time setup (see docs/releasing.md):
#   1. npmjs.com → each of @xproeditor/core, /vue, /react → Settings →
#      Trusted publisher → GitHub Actions: owner `xofdev`, repository
#      `xproeditor`, workflow `release.yml`, environment `npm`.
#   2. GitHub → Settings → Environments → create `npm` (optionally restrict
#      it to the `main` branch / add required reviewers).
#   3. GitHub → Settings → Actions → General → Workflow permissions →
#      enable "Allow GitHub Actions to create and approve pull requests".

on:
  push:
    branches: [main]
  # Retry a failed publish (e.g. after fixing npm settings) without a new commit.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run that may be half-way through publishing.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version PR or publish
    # Forks can't publish (and have no trusted-publisher entry anyway).
    if: github.repository == 'xofdev/xproeditor'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Must match the environment named in each package's npm trusted publisher.
    environment: npm
    permissions:
      contents: write # version commit + git tags + GitHub releases
      pull-requests: write # the "chore: version packages" PR
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Stay on npm 11 so a future
      # major can't silently change publish behaviour.
      - name: Use npm 11
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # v1 is the line built for @changesets/cli v2 (this repo); action v2
      # requires CLI v3 and fails with "Changesets CLI v2 is not supported".
      - name: Create version PR or publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run version-packages
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Summarize published packages
        if: steps.changesets.outputs.published == 'true'
        env:
          PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          echo "### Published to npm" >> "$GITHUB_STEP_SUMMARY"
          echo "$PACKAGES" | jq -r '.[] | "- `\(.name)@\(.version)`"' >> "$GITHUB_STEP_SUMMARY"

      - name: Explain a failed publish
        if: failure() && steps.changesets.outcome == 'failure'
        run: |
          echo "::error title=Release failed::E404/E401/ENEEDAUTH on 'npm publish' means npm trusted publishing is not configured for that package (owner xofdev, repo xproeditor, workflow release.yml, environment npm). 'GitHub Actions is not permitted to create or approve pull requests' means the repo setting under Settings → Actions → General is off. See docs/releasing.md, then re-run this workflow."
